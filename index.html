<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jon Hathaway — Games</title>
<style>
:root {
  --bg: #ffffff;
  --text: #1d1d1f;
  --muted: #6e6e73;
  --accent: #b8860b;
  --rule: #e5e5ea;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111111;
    --text: #f2f2f2;
    --muted: #a1a1a6;
    --accent: #e8b84a;
    --rule: #2c2c2e;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 8px; }
h2 { font-size: 1.25rem; margin: 2em 0 0.5em; padding-top: 1em; border-top: 1px solid var(--rule); }
a { color: var(--accent); }
.meta { color: var(--muted); margin: 0 0 1.5em; }
dt { font-weight: 600; margin-top: 1.2em; }
dd { margin: 0.25em 0 0; }
footer { color: var(--muted); font-size: 0.9rem; margin-top: 3em; padding-top: 1em; border-top: 1px solid var(--rule); }
</style>
</head>
<body>
<main>
<h1>Jon Hathaway — Games</h1>
<h2>Droidius: 1945</h2>
<p><a href="droidius/support/">Support</a> · <a href="droidius/privacy/">Privacy Policy</a></p>
</main>
</body>
</html>
